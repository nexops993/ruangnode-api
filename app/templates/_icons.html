{% macro icon(name, size=22) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == "logo" %}
<circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="8" r="2.6"/><circle cx="9" cy="18" r="2.6"/><path d="M8.3 6.9l7 .7M6.9 8.4l1.2 6.9M16.6 10.3l-5.3 5.2"/>

<path d="M12 3v11m0 0l-4.2-4.2M12 14l4.2-4.2"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>

<rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="10.2" y="10.2" width="3.6" height="3.6" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
{% elif name == "tools" %}
<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
{% elif name == "stalk" %}
<path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>
{% elif name == "ptero" %}
<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>
{% elif name == "re" %}
<path d="M8.5 6L3 12l5.5 6M15.5 6L21 12l-5.5 6"/>
{% elif name == "info" %}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8h.01"/>
{% elif name == "maker" %}
<rect x="3" y="3" width="8" height="8" rx="2"/><circle cx="16.8" cy="7.3" r="3.8"/><path d="M5.5 20.5l5-8.5 5 8.5z"/>

<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4"/>
{% elif name == "key" %}
<circle cx="8" cy="15.5" r="4.5"/><path d="M11.3 12.2L20 3.5M16.5 5l2.5 2.5M13.8 7.7l2.2 2.2"/>
{% elif name == "arrow" %}
<path d="M4 12h15m-6-6l6 6-6 6"/>
{% elif name == "check" %}
<path d="M4.5 12.5l5 5L19.5 7"/>
{% elif name == "book" %}
<path d="M12 6.2C10 4.7 7.4 4.2 4 4.2v13.6c3.4 0 6 .5 8 2 2-1.5 4.6-2 8-2V4.2c-3.4 0-6 .5-8 2z"/><path d="M12 6.2v13.6"/>

<path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 16.5L20.5 12 16 7.5M20.5 12H9.5"/>
{% elif name == "shield" %}
<path d="M12 3l7 2.8v5.4c0 4.6-3 7.9-7 9.8-4-1.9-7-5.2-7-9.8V5.8z"/><path d="M9 11.6l2.2 2.2 3.8-4"/>
{% elif name == "layers" %}
<path d="M12 3.5l9 4.7-9 4.7-9-4.7z"/><path d="M3.6 13.4L12 17.8l8.4-4.4"/>
{% endif %}
</svg>
