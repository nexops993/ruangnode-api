<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RuangNode API{% endblock %}</title>
<meta name="description" content="RuangNode API — REST API publik multi-modul. Gratis, tanpa daftar, satu API key untuk semua.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2fa; --card:#ffffff; --ink:#2c2842; --muted:#6e6884;
    --accent:#6c5ce7; --accent-dark:#5748c9; --line:rgba(44,40,66,.08);
    --soon-bg:#fff3e2; --soon-tx:#99600f; --live-bg:#e2f4e8; --live-tx:#1d6b43;
    --shadow:0 8px 24px rgba(108,92,231,.07),0 2px 6px rgba(44,40,66,.05),inset 0 1px 0 rgba(255,255,255,.9);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
    font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
  /* header */
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.78);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:17px;letter-spacing:-.01em}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:none}
  .brand em{font-style:normal;color:var(--accent)}
  nav{margin-left:auto;display:flex;align-items:center;gap:4px}
  nav a.link{color:var(--ink);font-weight:600;font-size:14.5px;padding:8px 10px;border-radius:10px}
  nav a.link:hover{background:rgba(108,92,231,.08)}
  @media (max-width:560px){ nav a.link{display:none} nav a.link.keep{display:block} }
  /* tombol */
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:15px;color:#fff;background:var(--accent);
    padding:11px 20px;border-radius:12px;box-shadow:0 6px 16px rgba(108,92,231,.28);
    transition:background .15s ease,transform .1s ease}
  .btn:hover{background:var(--accent-dark)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
  .btn.ghost:hover{background:#fbfaff}
  .btn.sm{padding:9px 16px;font-size:14px;border-radius:11px}
  .btn.block{width:100%;justify-content:center}
  /* kartu & tipografi */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  h1{font-size:clamp(1.55rem,5.2vw,2.25rem);line-height:1.15;margin:0 0 8px;letter-spacing:-.02em;font-weight:800}
  h2{font-size:1.16rem;margin:0 0 6px;letter-spacing:-.01em}
  h3{font-size:1rem;margin:0 0 4px}
  p{margin:0 0 10px;color:var(--muted)}
  p.lead{font-size:16px;max-width:560px}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--accent);
    background:rgba(108,92,231,.09);padding:6px 12px;border-radius:999px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .note{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:16px}
  .note svg{flex:none;margin-top:1px;color:var(--accent)}
  /* statistik ringkas */
  .stats{display:flex;flex-wrap:wrap;gap:8px 0;padding:16px 22px}
  .stat{flex:1 1 120px;text-align:center;padding:4px 8px}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat .num{font-size:21px;font-weight:800;letter-spacing:-.01em}
  .stat .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
  @media (max-width:560px){
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 0;padding:16px 14px}
    .stat + .stat{border-left:0}
    .stat:nth-child(even){border-left:1px solid var(--line)}
    .stat:nth-child(n+3){border-top:1px solid var(--line);padding-top:12px}
  }
  /* grid modul — mobile-first: 1 kolom lega di HP, melebar bertahap */
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:560px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px} }
  .mod{padding:16px;margin:0;display:flex;flex-direction:column;gap:2px}
  .tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .t-download{background:#ece8fd;color:#6c5ce7}.t-ai{background:#e3eefc;color:#2f6fd0}
  .t-tools{background:#fdeedd;color:#c26d1d}.t-stalk{background:#fbe7ef;color:#c23a72}
  .t-ptero{background:#e2f4e8;color:#1d8a4e}.t-re{background:#e9e6fb;color:#5a48c9}
  .t-info{background:#e0f4f6;color:#177e89}.t-maker{background:#f3e8f7;color:#9b4dca}
  .mod p{font-size:13.5px;line-height:1.55;margin:0 0 10px}
  .mod .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .count{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px}
  .soon{background:var(--soon-bg);color:var(--soon-tx)}
  .live{background:var(--live-bg);color:var(--live-tx)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.ok{background:#22a35c}.dot.bad{background:#d64545}.dot.na{background:#b9b3cc}
  /* form login */
  .login-wrap{max-width:420px;margin:5vh auto 0}
  .login-card{padding:26px 24px}
  .login-card h1{font-size:1.45rem}
  input.token{width:100%;font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--ink);
    padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfaff;outline:none;margin:6px 0 14px}
  input.token:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);background:#fff}
  .err{display:flex;gap:9px;align-items:flex-start;background:#fdecea;color:#b3261e;font-size:14px;font-weight:600;
    border-radius:12px;padding:11px 14px;margin:12px 0}
  .err svg{flex:none;margin-top:1px}
  /* kode & tabel */
  code,pre{font-family:"JetBrains Mono",monospace}
  code{font-size:.92em;background:rgba(108,92,231,.08);padding:1px 6px;border-radius:6px}
  pre{background:#241f3d;color:#e9e5ff;border-radius:14px;padding:15px 16px;overflow-x:auto;
    font-size:13px;line-height:1.65;margin:10px 0}
  pre code{background:none;padding:0}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.mono{font-family:"JetBrains Mono",monospace;font-size:13px;white-space:nowrap}
  /* tabel tidak boleh melebar melewati layar HP: tabelnya yang bergeser, bukan halamannya */
  @media (max-width:700px){
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
    code{word-break:break-word}
  }
  .steps{display:grid;gap:14px}
  @media (min-width:700px){ .steps{grid-template-columns:repeat(3,1fr)} }
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .n{width:28px;height:28px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .step p{font-size:14px;margin:0}
  .step b{color:var(--ink)}
  .foot{color:var(--muted);font-size:13px;text-align:center;padding:26px 0 6px}
  .center{text-align:center}
  /* explorer: sidebar laci (tersembunyi; dibuka tombol hamburger kiri atas) */
  .explorer{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  .explorer>*{min-width:0}
  .hambtn{width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:var(--shadow);padding:0}
  .hambtn:hover{background:#fbfaff}
  .side{padding:14px 12px;position:fixed;top:0;bottom:0;left:0;width:min(324px,86vw);z-index:80;
    border-radius:0;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;overflow-x:hidden}
  .side-h{display:flex;align-items:center;width:100%;margin-bottom:8px}
  .side-h b{font-size:15px}
  .side .grp-h{width:100%;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left}
  .side .grp-h .chev{display:inline-flex;color:var(--muted);transition:transform .18s ease}
  .side .grp.open .grp-h .chev{transform:rotate(180deg)}
  .side .eps{display:none}
  .side .grp.open .eps{display:block}
  .side.open{transform:none;box-shadow:0 0 60px rgba(44,40,66,.35)}
  .backdrop{position:fixed;inset:0;background:rgba(44,40,66,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.on{opacity:1;pointer-events:auto}
  .side .ov{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;color:var(--ink);font-weight:700;font-size:14.5px;border:1px solid transparent}
  .side .ov:hover,.side a.ep:hover{background:#fbfaff;border-color:var(--line)}
  .side .ov.on{background:rgba(108,92,231,.10);color:var(--accent-dark);border-color:rgba(108,92,231,.25)}
  .side .grp{margin-top:14px}
  .side .grp-h{display:flex;align-items:center;gap:8px;padding:4px 10px;font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
  .side .grp-h .tile{width:24px;height:24px;flex:none}
  .side .grp-h .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;background:var(--bg);border-radius:99px;padding:1px 8px;text-transform:none;letter-spacing:0}
  .side a.ep{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;border:1px solid transparent}
  .side a.ep.on{background:rgba(108,92,231,.10);color:var(--accent-dark);border-color:rgba(108,92,231,.25)}
  .side a.ep .m{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;color:var(--live-tx);background:var(--live-bg);border-radius:6px;padding:1px 6px;flex:none}
  .side a.ep .p{font-family:"JetBrains Mono",monospace;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .x{display:flex;margin-left:auto}
  /* tabel lebar: geser DI DALAM kotaknya, tidak melebarkan halaman */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tblwrap table{min-width:560px}
  .mono{overflow-wrap:anywhere}
</style>
</head>
<body>
{% from "_icons.html" import icon %}
<header>
  <div class="bar">
    {% block sidebtn %}{% endblock %}
    <a class="brand" href="/"><span class="mark">{{ icon("logo", 20) }}</span>RuangNode&nbsp;<em>API</em></a>
    <nav>{% block nav %}{% endblock %}</nav>
  </div>
</header>
<div class="wrap">
  {% block content %}{% endblock %}
  <div class="foot">RuangNode API · REST API publik — gratis, tanpa daftar</div>
</div>
</body>
</html>
